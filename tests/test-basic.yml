name: Test basic usage - scan clean Rails app
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake curl and fake brakeman
        run: |
          echo "$GITHUB_WORKSPACE/tests/fixtures/bin" >> $GITHUB_PATH

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          skip_install: 'true'
          reporter: local
          filter_mode: nofilter
          fail_level: none
          workdir: tests/fixtures/rails-app

      - name: Assert action completed successfully
        run: |
          echo "Action completed with exit code 0 (no issues found or fail_level=none)"
          echo "PASS"
