name: Test scanning Rails app with security issues
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake curl and fake brakeman
        run: |
          echo "$GITHUB_WORKSPACE/tests/fixtures/bin" >> $GITHUB_PATH

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          skip_install: 'true'
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: warning
          workdir: tests/fixtures/rails-app-with-issues

      - name: Assert action completed (issues found but fail_level=none)
        run: |
          echo "Action completed successfully - brakeman found issues but fail_level=none means exit 0"
          echo "PASS"
