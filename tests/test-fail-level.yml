name: Test fail_level any fails on findings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake brakeman
        run: |
          mkdir -p /tmp/fakebin
          cat > /tmp/fakebin/brakeman <<'EOF'
          #!/bin/sh
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              --output|-o) out="$arg" ;;
            esac
            prev="$arg"
          done
          printf 'app/controllers/users_controller.rb\t5\tSQL Injection\tCheckSQL\tPossible SQL injection\tHigh\n' > "$out"
          touch /tmp/brakeman-ran
          EOF
          chmod +x /tmp/fakebin/brakeman
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          skip_install: 'true'
          reporter: local
          filter_mode: nofilter
          fail_level: any
      - name: Assert action failed due to findings
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          [ -f /tmp/brakeman-ran ] || { echo "FAIL: brakeman not invoked"; exit 1; }
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with fail_level=any and a finding"
            exit 1
          fi
          echo "PASS"
