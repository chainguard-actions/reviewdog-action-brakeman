name: Test custom tool_name and level inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake curl and fake brakeman
        run: |
          echo "$GITHUB_WORKSPACE/tests/fixtures/bin" >> $GITHUB_PATH

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          skip_install: 'true'
          tool_name: 'my-brakeman'
          level: 'warning'
          reporter: local
          filter_mode: nofilter
          fail_level: none
          workdir: tests/fixtures/rails-app

      - name: Assert action completed with custom tool_name and level
        run: |
          echo "Action completed successfully with custom tool_name='my-brakeman' and level='warning'"
          echo "PASS"
